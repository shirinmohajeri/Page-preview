<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logbot Website Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <section class="hero">
    <header class="navbar">
      <img
        class="logo-img"
        src="https://raw.githubusercontent.com/shirinmohajeri/HTML/refs/heads/main/logo.webp"
        alt="Logbot logo"
      />

      <nav class="menu">
        <a href="#">Product</a>
        <a href="#">Use Case</a>
        <a href="#">Partners</a>
        <a href="#">Blog</a>
        <a href="#">Company</a>
        <a href="#">Contacts</a>
        <a href="#">Login</a>
        <a href="#">Support</a>
        <span class="language">🇬🇧</span>
        <a href="#">🔍</a>
      </nav>
    </header>

    <div class="hero-content">
      <div class="text-box">
        <div class="tag">INDUSTRIAL IOT PLATFORM</div>

        <h1 id="hero-title">
          Chat with<br />
          your <span>machines</span>
        </h1>

        <p class="subtitle" id="hero-subtitle">
          The IoT solution of choice<br />
          for OEMs and businesses
        </p>

        <button class="cta">
          FIND OUT MORE <span>→</span>
        </button>
      </div>

      <div class="visual-card">
        <div id="slide-one-visual" class="slide-visual">

          <img
            class="hero-person"
            src="https://raw.githubusercontent.com/shirinmohajeri/HTML/refs/heads/main/Adobe%20Express%20-%20file.png"
            alt="Logbot woman holding package"
          />
        </div>
          <div id="slide-two-visual" class="slide-visual hidden">
            
           <div class="dashboard-image-box">
          <img class="dashboard-image" src="https://raw.githubusercontent.com/shirinmohajeri/HTML/refs/heads/main/1009b297-0d90-4ed3-8cce-9d16a36cf799.png" alt="Logbot dashboard mockup"/>
          </div>
        </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="slider-controls">
      <span class="slider-dot active"></span>
      <span class="slider-dot"></span>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
